<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Favorites - Wanderly</title>
  <script>
    try {
      if (localStorage.getItem("wanderly:darkMode") === "true") {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-page="favorites" class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div id="site-header"></div>

  <main class="mx-auto max-w-7xl px-4 py-8">
    <div class="mb-8 max-w-2xl">
      <span class="text-xs font-black uppercase tracking-wider text-teal-600">Saved Stays & Experiences</span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-950 dark:text-white mt-1">My Saved Favorites</h1>
      <p class="text-xs text-slate-400 mt-1">Bookmark hotels and activities you love to easily compare and add them to your travel schedule.</p>
    </div>

    <!-- Favorites Grid -->
    <div id="favorites-grid" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/real-images.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/firebase-auth.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
