<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinations & Hotels - Wanderly</title>
  <script>
    try {
      if (localStorage.getItem("wanderly:darkMode") === "true") {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>

<body data-page="destination" class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div id="site-header"></div>

  <main>
    <!-- Destination Hero Banner -->
    <section id="destination-hero" class="hero-section min-h-[44vh] flex items-end bg-cover bg-center py-12 px-4">
      <div class="mx-auto max-w-7xl w-full flex flex-col justify-end text-white">
        <div class="flex flex-wrap items-center gap-3">
          <span class="hero-kicker-pill uppercase tracking-wider">
            <i class="fa-solid fa-hotel text-teal-300"></i> Verified Listings & Booking
          </span>
          <!-- Destination Quick Switcher -->
          <div class="relative">
            <select id="destination-quick-select" class="rounded-full border border-white/30 bg-slate-900/80 px-4 py-1.5 text-xs font-black text-white backdrop-blur-md outline-none cursor-pointer hover:bg-slate-900"></select>
          </div>
          <!-- Weather Pill Badge -->
          <div id="destination-weather-pill" class="flex items-center gap-1.5 rounded-full border border-white/30 bg-slate-900/80 px-3.5 py-1.5 text-xs font-bold text-white backdrop-blur-md"></div>
        </div>
        <h1 id="destination-title" class="mt-3 text-4xl sm:text-6xl font-black"></h1>
        <p id="destination-copy" class="mt-2 max-w-2xl text-sm sm:text-base leading-6 text-slate-200"></p>
      </div>
    </section>

    <!-- Main Explorer Section -->
    <section class="mx-auto max-w-7xl px-4 py-8 pb-16">
      <!-- Top View Switcher Tabs (Hotels vs Places) -->
      <div class="mb-8 flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-4 dark:border-slate-800">
        <div class="flex flex-wrap gap-2.5" id="explore-view-tabs">
          <button id="tab-hotels-btn" class="dest-filter-tab active font-black" data-view="hotels">
            <i class="fa-solid fa-hotel"></i>
            <span>Verified Hotels & Stays</span>
            <span id="hotels-badge-count" class="ml-1 rounded-full bg-slate-200/60 px-2 py-0.5 text-xs font-bold dark:bg-slate-700/60">0</span>
          </button>
          <button id="tab-places-btn" class="dest-filter-tab font-black" data-view="places">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Attractions, Dining & Activities</span>
            <span id="places-badge-count" class="ml-1 rounded-full bg-slate-200/60 px-2 py-0.5 text-xs font-bold dark:bg-slate-700/60">0</span>
          </button>
        </div>

        <div class="text-xs font-bold text-slate-500 dark:text-slate-400">
          <span>Click any hotel to book, select stay dates, or inspect verified guest photos.</span>
        </div>
      </div>

      <!-- Main Two-Column Layout (Sidebar Filters & Map + Cards Grid) -->
      <div class="grid items-start gap-8 lg:grid-cols-[380px_1fr]">
        
        <!-- Sidebar Controls & Interactive Map -->
        <div class="space-y-6 lg:sticky lg:top-24">
          
          <!-- Interactive Map Box -->
          <div class="relative overflow-hidden rounded-2xl shadow-md border border-slate-200 dark:border-slate-800">
            <div id="destination-map" class="h-[360px] w-full"></div>
            <!-- Map Legend -->
            <div class="absolute bottom-3 left-3 z-[400] flex flex-wrap gap-2 rounded-xl bg-white/90 p-2 text-[11px] font-bold text-slate-800 shadow-md backdrop-blur-md dark:bg-slate-900/90 dark:text-slate-200">
              <span class="flex items-center gap-1"><span class="size-2.5 rounded-full bg-sky-600"></span> Hotels</span>
              <span class="flex items-center gap-1"><span class="size-2.5 rounded-full bg-teal-600"></span> Attractions</span>
              <span class="flex items-center gap-1"><span class="size-2.5 rounded-full bg-amber-500"></span> Dining</span>
            </div>
          </div>

          <!-- Hotels Filters Box -->
          <div id="hotels-filter-box" class="rounded-2xl bg-white p-5 shadow-sm border border-slate-200 dark:border-slate-800 dark:bg-slate-900 space-y-4">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-black uppercase tracking-wider text-slate-400">Filter by Star Rating</span>
              </div>
              <div class="flex flex-wrap gap-1.5" id="star-filter-chips">
                <button type="button" data-star-btn="all" class="chip chip-active text-xs py-1 px-3 font-bold">All</button>
                <button type="button" data-star-btn="5" class="chip text-xs py-1 px-3 font-bold"><i class="fa-solid fa-star text-amber-500 mr-1"></i> 5 Stars</button>
                <button type="button" data-star-btn="4" class="chip text-xs py-1 px-3 font-bold"><i class="fa-solid fa-star text-amber-500 mr-1"></i> 4 Stars</button>
                <button type="button" data-star-btn="3" class="chip text-xs py-1 px-3 font-bold"><i class="fa-solid fa-star text-amber-500 mr-1"></i> 3 Stars</button>
              </div>
            </div>

            <!-- Dynamic Live Price Range Slider -->
            <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-black uppercase tracking-wider text-slate-400">Max Price / Night</span>
                <span id="hotel-price-label" class="text-xs font-black text-teal-600">Up to $500</span>
              </div>
              <input type="range" id="hotel-price-slider" min="50" max="1000" step="10" value="1000" class="w-full accent-teal-600 cursor-pointer">
            </div>

            <!-- Hotel Search & Sort -->
            <div class="pt-2 border-t border-slate-100 dark:border-slate-800 space-y-3">
              <div>
                <label class="block text-xs font-black uppercase tracking-wider text-slate-400 mb-1">Search Hotel or Amenity</label>
                <input id="hotel-search-input" type="text" placeholder="e.g. Mena House, Pool, Beachfront, Spa..." class="field text-xs py-2">
              </div>
              <div>
                <label class="block text-xs font-black uppercase tracking-wider text-slate-400 mb-1">Sort Hotels By</label>
                <select id="hotel-sort-select" class="field text-xs py-2">
                  <option value="smart">🏆 Smart Match & Guest Rating</option>
                  <option value="price-low">💰 Price: Low to High</option>
                  <option value="price-high">💎 Price: High to Low</option>
                  <option value="stars">⭐ Star Rating (5 to 3)</option>
                  <option value="proximity">🎯 Strategic Proximity to Landmarks</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Places Filters Box (Shown when Attractions tab is active) -->
          <div id="places-filter-box" class="hidden rounded-2xl bg-white p-5 shadow-sm border border-slate-200 dark:border-slate-800 dark:bg-slate-900 space-y-4">
            <div>
              <span class="text-xs font-black uppercase tracking-wider text-slate-400 block mb-2">Category Filter</span>
              <div class="flex flex-wrap gap-1.5" id="place-category-chips">
                <button type="button" data-place-cat="all" class="chip chip-active text-xs py-1 px-3">All</button>
                <button type="button" data-place-cat="landmarks" class="chip text-xs py-1 px-3"><i class="fa-solid fa-landmark text-teal-600 mr-1"></i> Landmarks</button>
                <button type="button" data-place-cat="restaurants" class="chip text-xs py-1 px-3"><i class="fa-solid fa-utensils text-amber-500 mr-1"></i> Dining</button>
                <button type="button" data-place-cat="activities" class="chip text-xs py-1 px-3"><i class="fa-solid fa-compass text-sky-500 mr-1"></i> Activities</button>
              </div>
            </div>
            <div>
              <label class="block text-xs font-black uppercase tracking-wider text-slate-400 mb-1">Search Activities & Dining</label>
              <input id="place-search-input" type="text" placeholder="Search museum, felucca, bazaar..." class="field text-xs py-2">
            </div>
          </div>
        </div>

        <!-- Cards Display Area -->
        <div>
          <!-- Hotels Grid -->
          <div id="hotels-grid" class="grid gap-6 md:grid-cols-2"></div>

          <!-- Places Grid -->
          <div id="places-grid" class="hidden grid gap-6 md:grid-cols-2"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/real-images.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/firebase-auth.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
