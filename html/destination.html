<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Destination - Wanderly</title>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body data-page="destination" class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <div id="site-header"></div>
  <main>
    <section id="destination-hero" class="hero-section bg-cover bg-center">
      <div class="mx-auto flex min-h-[50vh] max-w-7xl flex-col justify-end px-4 py-12 text-white">
        <p class="hero-kicker-pill font-black uppercase tracking-[.18em] text-teal-200">Explore Destination</p>
        <h1 id="destination-title" class="mt-4 text-5xl font-black md:text-6xl"></h1>
        <p id="destination-copy" class="mt-3 max-w-2xl text-lg leading-8 text-slate-100"></p>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-4 py-8">
      <div data-progress class="mb-8 flex items-center gap-3"></div>
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div id="weather-card"
          class="flex flex-wrap items-center gap-3 rounded-2xl bg-white p-5 font-bold shadow-sm dark:bg-slate-900">
        </div>
        <!-- Active Trip Hotel Notification Banner -->
        <div id="trip-hotel-status" class="hidden rounded-2xl border border-teal-500/30 bg-teal-50/70 p-4 dark:bg-teal-950/40">
        </div>
      </div>
    </section>

    <!-- Main Section with Tabs and Map -->
    <section class="mx-auto max-w-7xl px-4 pb-16">
      <!-- Section Navigation Tabs -->
      <div class="mb-8 flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-4 dark:border-slate-800">
        <div class="flex flex-wrap gap-3" id="explore-view-tabs">
          <button id="tab-places-btn" class="explore-tab active" data-view="places">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Attractions & Places</span>
            <span id="places-badge-count" class="ml-1 rounded-full bg-slate-200/60 px-2 py-0.5 text-xs font-bold dark:bg-slate-700/60">0</span>
          </button>
          <button id="tab-hotels-btn" class="explore-tab" data-view="hotels">
            <i class="fa-solid fa-hotel"></i>
            <span>Hotels & Stays</span>
            <span id="hotels-badge-count" class="ml-1 rounded-full bg-slate-200/60 px-2 py-0.5 text-xs font-bold dark:bg-slate-700/60">0</span>
          </button>
        </div>

        <div class="text-sm font-semibold text-slate-500 dark:text-slate-400">
          <span id="view-indicator-text">Showing curated attractions</span>
        </div>
      </div>

      <div class="grid items-start gap-6 lg:grid-cols-[.9fr_1.1fr]">
        <!-- Map & Controls Sidebar -->
        <div class="space-y-5">
          <div class="relative overflow-hidden rounded-2xl shadow-xl">
            <div id="destination-map" class="h-[480px] w-full"></div>
            <!-- Map Legend -->
            <div class="absolute bottom-3 left-3 z-[400] flex flex-wrap gap-2 rounded-xl bg-white/90 p-2.5 text-xs font-bold text-slate-800 shadow-lg backdrop-blur-md dark:bg-slate-900/90 dark:text-slate-200">
              <span class="flex items-center gap-1.5"><span class="inline-block size-3 rounded-full bg-teal-600"></span> Attractions</span>
              <span class="flex items-center gap-1.5"><span class="inline-block size-3 rounded-full bg-amber-500"></span> Hotels</span>
            </div>
          </div>

          <!-- Places Filters (Shown when Places view is active) -->
          <div id="places-filter-box" class="rounded-2xl bg-white p-5 shadow-sm dark:bg-slate-900">
            <p class="mb-3 text-xs font-black uppercase tracking-wider text-slate-400">Filter Activities</p>
            <div id="category-filter" class="flex flex-wrap gap-2"></div>
            <div class="mt-4 grid gap-3 sm:grid-cols-[1fr_auto]">
              <input id="place-search" class="field" placeholder="Search places & activities...">
              <select id="price-sort" class="field">
                <option value="featured">Featured Order</option>
                <option value="low">Price: Low to high</option>
                <option value="high">Price: High to low</option>
              </select>
            </div>
          </div>

          <!-- Hotels Filters (Shown when Hotels view is active) -->
          <div id="hotels-filter-box" class="hidden rounded-2xl bg-white p-5 shadow-sm dark:bg-slate-900">
            <p class="mb-3 text-xs font-black uppercase tracking-wider text-slate-400">Filter Hotels by Stars</p>
            <div id="star-filter" class="flex flex-wrap gap-2">
              <button class="chip chip-active" data-star="all">All Stars</button>
              <button class="chip" data-star="5"><i class="fa-solid fa-star text-amber-500 mr-1"></i> 5 Stars</button>
              <button class="chip" data-star="4"><i class="fa-solid fa-star text-amber-500 mr-1"></i> 4 Stars</button>
              <button class="chip" data-star="3"><i class="fa-solid fa-star text-amber-500 mr-1"></i> 3 Stars</button>
            </div>
            <div class="mt-4 grid gap-3 sm:grid-cols-[1fr_auto]">
              <input id="hotel-search" class="field" placeholder="Search hotel name or amenities...">
              <select id="hotel-sort" class="field">
                <option value="proximity">🎯 Closest to my places (الأقرب للأنشطة)</option>
                <option value="stars-high">⭐ Star Rating (5 to 3)</option>
                <option value="rating">🏆 Top Guest Rated</option>
                <option value="price-low">💰 Price: Low to high</option>
                <option value="price-high">💎 Price: High to low</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Cards Display (Places or Hotels) -->
        <div>
          <!-- Places Grid -->
          <div id="places-grid" class="grid gap-5 md:grid-cols-2"></div>

          <!-- Hotels Grid -->
          <div id="hotels-grid" class="hidden grid gap-5 md:grid-cols-2"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="review-modal"></div>
  <div id="site-footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
