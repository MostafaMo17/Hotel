<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Planner Setup - Wanderly</title>
  <script>
    try {
      if (localStorage.getItem("wanderly:darkMode") === "true") {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-page="planner" class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div id="site-header"></div>

  <main class="mx-auto max-w-7xl px-4 py-8">
    <div class="mb-8 max-w-2xl">
      <span class="text-xs font-black uppercase tracking-wider text-teal-600">Smart Trip Planner</span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-950 dark:text-white mt-1">Configure Your Stay & Custom Itinerary</h1>
      <p class="text-xs text-slate-500 mt-1">Select your preferred hotel, duration, and trip vibe. Wanderly will auto-generate your day-by-day plan with local recommendations.</p>
    </div>

    <section class="grid gap-8 lg:grid-cols-[1.1fr_.9fr]">
      <!-- Setup Form -->
      <form id="planner-form" class="rounded-2xl bg-white p-6 md:p-8 shadow-sm border border-slate-200 dark:border-slate-800 dark:bg-slate-900">
        <div class="flex items-center justify-between border-b border-slate-100 pb-4 dark:border-slate-800">
          <span class="text-xs font-black uppercase text-teal-600 flex items-center gap-1.5">
            <i class="fa-solid fa-sliders"></i> Trip Parameters
          </span>
          <span class="verified-badge"><i class="fa-solid fa-bolt"></i> Instant Schedule Generation</span>
        </div>

        <div class="mt-6 grid gap-5 sm:grid-cols-2">
          <div class="sm:col-span-2">
            <label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1.5">
              Trip Category
            </label>
            <select id="trip-scope" name="tripScope" required class="field text-sm font-bold">
              <option value="domestic">🇪🇬 Inside Egypt (سياحة داخلية - محافظات مصر)</option>
              <option value="international">🌍 Outside Egypt (سياحة خارجية - حول العالم)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1.5">
              Destination City
            </label>
            <select id="destination-options" name="destinationId" required class="field text-sm font-bold"></select>
          </div>

          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1.5">
              Trip Vibe / Style
            </label>
            <select name="tripType" required class="field text-sm font-bold">
              <option value="Leisure">🏖️ Leisure & Relaxation</option>
              <option value="Culture">🏛️ Cultural & Historical Heritage</option>
              <option value="Adventure">🏄 Adventure & Safari</option>
              <option value="Romantic">✨ Romantic & Honeymoon</option>
              <option value="Family">👨‍👩‍👧 Family Friendly</option>
            </select>
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1.5">
              Select Verified Hotel Stay
            </label>
            <select id="hotel-options" name="hotelId" required class="field text-sm font-bold"></select>
          </div>

          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1.5">
              Trip Duration (Days)
            </label>
            <input name="days" type="number" min="1" max="14" value="4" required class="field text-sm font-bold">
          </div>

          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1.5">
              Travelers
            </label>
            <input name="travelers" type="number" min="1" max="12" value="2" required class="field text-sm font-bold">
          </div>

          <div class="sm:col-span-2">
            <label data-budget-currency-label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1.5">
              Trip Budget
            </label>
            <input name="budget" type="number" min="1" step="any" value="1500" required class="field text-sm font-bold">
          </div>
        </div>

        <button class="btn-primary mt-8 w-full justify-center py-3.5 text-sm font-black shadow-lg" type="submit">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Create & Generate Day-by-Day Itinerary</span>
        </button>
      </form>

      <!-- Live Preview Aside -->
      <aside class="rounded-2xl bg-white p-6 shadow-sm border border-slate-200 dark:border-slate-800 dark:bg-slate-900">
        <div id="planner-preview"></div>
      </aside>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/real-images.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/firebase-auth.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
