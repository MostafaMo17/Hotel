<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Summary & Voucher - Wanderly</title>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body data-page="summary" class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div id="site-header"></div>

  <main class="mx-auto max-w-7xl px-4 py-8">
    <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <span class="text-xs font-black uppercase tracking-wider text-teal-600">Final Booking & Itinerary Voucher</span>
        <h1 class="text-3xl sm:text-4xl font-black text-slate-950 dark:text-white mt-1">Trip Summary Report</h1>
        <p class="text-xs text-slate-400 mt-1">Download your official itinerary voucher or export a clean PDF for your travels.</p>
      </div>
      <div class="flex flex-wrap gap-2.5">
        <button id="export-pdf" class="btn-primary text-xs font-black">
          <i class="fa-solid fa-file-pdf"></i> Export to PDF
        </button>
        <a href="my-trip.html" class="btn-soft text-xs font-black">
          <i class="fa-solid fa-pen-to-square"></i> Edit Itinerary
        </a>
        <button id="start-over" class="btn-soft text-xs font-black text-rose-500 hover:text-rose-600">
          <i class="fa-solid fa-rotate-left"></i> Start New Trip
        </button>
      </div>
    </div>

    <!-- Summary Report Container -->
    <div id="summary-report"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
